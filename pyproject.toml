[project]
name = "eurag"
version = "0.1.0"
description = "RAG over EU and Portuguese AML regulation, evaluated in three configurations with Ragas"
readme = "README.md"
authors = [
    { name = "Ricardo Faria", email = "40174689+ricardorfaria1@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.9.0",
    "beautifulsoup4>=4.15.0",
    "docling>=2.150.1",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain==1.5.*",
    "langchain-anthropic>=1.7.10",
    "langchain-huggingface>=1.2.3",
    "langchain-qdrant==1.1.*",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "ragas==0.4.*",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
eurag = "eurag.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: needs model downloads (embeddings, Docling); skipped in CI",
    "paid: calls the Anthropic API",
]
addopts = "-m 'not models and not paid'"
